services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: casino_user
      POSTGRES_PASSWORD: casino_pass
      POSTGRES_DB: casino
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino_user -d casino"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: casino_user
      DB_PASSWORD: casino_pass
      DB_NAME: casino
      DB_SSLMODE: disable
      # Required, no default: the server refuses to start if unset or < 32 bytes.
      # Provide it on the host or via a .env file next to this compose file.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: "15"
      JWT_REFRESH_EXPIRY: "10080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
